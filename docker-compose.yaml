version: '3.8'

services:
  ros2_jazzy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jazzy_container
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./workspace/src:/root/ros2_ws/src
      - ./.ros/log:/root/.ros/log
    ports:
      - "9091:9091"
    network_mode: host
    privileged: true

networks:
  default:
    external:
      name: host
